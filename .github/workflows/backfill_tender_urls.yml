name: Backfill Tender Direct URLs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread google-auth

      - name: Install Chromium
        run: |
          playwright install chromium --with-deps

      - name: Run URL Backfill
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python backfill_tender_urls.py

      - name: Export Dashboard Data
        if: success()
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python scripts/export_dashboard_data.py

      - name: Commit Dashboard Data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tenders.json
          if git diff --cached --quiet; then
            echo "No dashboard data changes."
          else
            git commit -m "Backfill tender direct URLs"
            git pull --rebase origin main
            git push origin main
          fi
