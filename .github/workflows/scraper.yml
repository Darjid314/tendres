name: Oman Tenders Hourly Scraper

on:
  schedule:
    - cron: '0 * * * *'  # Har ghante automatic chalega
  workflow_dispatch:      # Manual chalaane ka button

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4  # Node.js 24 compatible version

    - name: Set up Python
      uses: actions/setup-python@v5  # Node.js 24 compatible version
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        python -m playwright install chromium --with-deps

    - name: Run Scraper Script
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      run: |
        python test2.py
