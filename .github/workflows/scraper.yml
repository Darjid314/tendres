name: Oman Tenders Hourly Scraper

on:
  schedule:
    - cron: '15 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies & Pip Packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 gspread google-auth deep-translator requests pypdf

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium --with-deps

      - name: Initialize Fetch Status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          path = 'docs/fetch_status.json'
          try:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
          except Exception:
              data = {}
          data['updated_at'] = datetime.now(timezone.utc).isoformat()
          data.setdefault('sources', {})
          for source in ['Oman Tender Board','SQU','BEAH','OMANTEL','JAGGAER']:
              data['sources'].setdefault(source, {'status':'unknown','fetched_at':None})
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Run Oman Tender Board Scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        continue-on-error: true
        run: |
          set +e
          python test2.py
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python scripts/update_fetch_status.py "Oman Tender Board" success
          else
            python scripts/update_fetch_status.py "Oman Tender Board" failed "exit code $rc"
          fi
          exit 0

      - name: Run Sultan Qaboos University SQU Scraper
        continue-on-error: true
        run: |
          set +e
          python scripts/scrape_squ.py
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python scripts/update_fetch_status.py SQU success
          else
            python scripts/update_fetch_status.py SQU failed "exit code $rc"
          fi
          exit 0

      - name: Run BEAH Omantel JAGGAER Scrapers
        continue-on-error: true
        run: |
          set +e
          python scripts/scrape_external_tenders.py
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python scripts/update_fetch_status.py BEAH success
            python scripts/update_fetch_status.py OMANTEL success
            python scripts/update_fetch_status.py JAGGAER success
          else
            python scripts/update_fetch_status.py BEAH failed "external scraper exit code $rc"
            python scripts/update_fetch_status.py OMANTEL failed "external scraper exit code $rc"
            python scripts/update_fetch_status.py JAGGAER failed "external scraper exit code $rc"
          fi
          exit 0

      - name: Run Legacy-Compatible Omantel JAGGAER Fallback
        continue-on-error: true
        run: |
          set +e
          python scripts/scrape_portal_fallback.py
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python scripts/update_fetch_status.py OMANTEL success "fallback" --fallback
            python scripts/update_fetch_status.py JAGGAER success "fallback" --fallback
          else
            python scripts/update_fetch_status.py OMANTEL failed "fallback exit code $rc" --fallback
            python scripts/update_fetch_status.py JAGGAER failed "fallback exit code $rc" --fallback
          fi
          exit 0

      - name: Inject Source Fetch Status Widget
        run: |
          python scripts/add_fetch_status_dashboard.py

      - name: Install Multi-Source Dashboard
        run: |
          cp docs/dashboard_multi_source.html docs/index.html

      - name: Export combined dashboard data
        if: success()
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python scripts/export_dashboard_data.py

      - name: Commit dashboard data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html docs/dashboard_multi_source.html docs/tenders.json docs/new_tenders.json docs/last_update.json docs/squ_tenders.json docs/external_tenders.json docs/fetch_status.json portal_seen_tenders.json

          if git diff --cached --quiet; then
            echo "No dashboard data changes."
          else
            git commit -m "Update multi-source Oman tender dashboard data"
            git push
          fi

# Force-run marker: per-source fetch status tracking enabled.
