name: Oman Tenders Hourly Scraper

on:
  schedule:
    - cron: '15 */3 * * *'  # Har 3 ghante me ek baar (jaise: 00:15, 03:15, 06:15, etc.)
  push:
    branches:
      - main              # Jab bhi code push karenge, yeh chalega
  workflow_dispatch:      # Manual "Run workflow" button

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install System Dependencies & Pip Packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 gspread google-auth deep-translator

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium --with-deps

      - name: Run Scraper Script & Trigger Email Alerts
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python cyber_history.py
