name: Oman Tenders Hourly Scraper

on:
  schedule:
    - cron: '15 * * * *'  # Har 1 ghante me ek baar
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies & Pip Packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 gspread google-auth deep-translator

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium --with-deps

      - name: Run Scraper Script & Trigger Email Alerts
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python test2.py

      - name: Export dashboard data
        if: success()
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python scripts/export_dashboard_data.py

      - name: Commit dashboard data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/tenders.json

          if git diff --cached --quiet; then
            echo "No dashboard data changes."
          else
            git commit -m "Update tender dashboard data"
            git push
          fi
